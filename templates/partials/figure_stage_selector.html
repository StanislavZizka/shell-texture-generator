<div class="form-group" id="patternStageGroup">
    <label for="pattern_stage" class="tooltip-wrapper">
        <span id="patternStageLabelText">Stage</span>
        <span class="tooltip-icon" tabindex="0">
            <i class="fas fa-info-circle"></i>
            <span class="tooltip-content" data-i18n="stage-tooltip-info">
                Stages represent pattern development from early formation to a stable structure.
            </span>
        </span>
    </label>
    <select id="pattern_stage" name="{{ stage_select_name }}" class="shell-selector" required aria-required="true" onchange="syncPatternStage(this.value)">
        <option value="" selected disabled data-i18n="stagePlaceholder">Select an option</option>
        {% if figure_mode == '23' %}
            {% for level_key in progression_order %}
                <option value="{{ level_key }}" data-stage-key="{{ level_key }}" data-stage-index="{{ loop.index }}">
                    Stage {{ loop.index }} / {% if loop.index == 1 %}Early formation{% elif loop.index == 2 %}Emerging pattern{% elif loop.index == 3 %}Developed pattern{% else %}Stabilized pattern{% endif %}
                </option>
            {% endfor %}
        {% else %}
            {% for stage_key in stage_order %}
                <option value="{{ loop.index }}" data-stage-key="{{ stage_key }}" data-stage-index="{{ loop.index }}">
                    Stage {{ loop.index }} / {% if loop.index == 1 %}Early formation{% elif loop.index == 2 %}Emerging pattern{% elif loop.index == 3 %}Developed pattern{% elif loop.index == 4 %}Stabilized pattern{% else %}Final pattern{% endif %}
                </option>
            {% endfor %}
        {% endif %}
    </select>
    <small class="form-help" id="stageHelp"{% if stage_help_i18n %} data-i18n="{{ stage_help_i18n }}"{% endif %}>{{ stage_help_text }}</small>
</div>
