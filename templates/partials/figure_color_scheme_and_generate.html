<div class="color-group">
    <h4><i class="fas fa-palette"></i> <span data-i18n="colorScheme">Color scheme</span></h4>
    <div class="color-inputs">
        <div class="form-group">
            <label for="color1" data-i18n="baseColor">Base color</label>
            <input type="color" id="color1" name="color1" value="#f3e7c6">
        </div>
        <div class="form-group">
            <label for="color2" data-i18n="contrastColor">Contrast color</label>
            <input type="color" id="color2" name="color2" value="#101010">
        </div>
    </div>
</div>

<button type="submit" id="generateBtn" class="btn btn-primary pattern-generate-btn" disabled>
    <i class="fas fa-magic"></i> Generate texture
</button>
